<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometric Masterpiece Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #e0e6ed;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
        }

        .viewport-frame {
            position: relative;
            background: #000;
            box-shadow: 0 0 100px rgba(0, 0, 0, 0.98);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .viewport-frame.aspect-9-16 {
            width: calc(100vh * (9/16));
            height: 100vh;
            max-width: 100vw;
        }

        .viewport-frame.aspect-1-1 {
            width: 90vh;
            height: 90vh;
            max-width: 90vw;
            max-height: 90vw;
        }

        .viewport-frame.aspect-16-9 {
            width: 100vw;
            height: calc(100vw * (9/16));
            max-height: 100vh;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        #hud-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 320px;
            background: rgba(4, 8, 15, 0.92);
            border: 1px solid rgba(0, 243, 255, 0.35);
            border-radius: 8px;
            backdrop-filter: blur(20px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.95);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }

        #hud-panel.collapsed {
            transform: translateX(-350px);
            opacity: 0;
            pointer-events: none;
        }

        .panel-header {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.55);
        }

        .panel-title {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #00f3ff;
        }

        .panel-content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #8c9eae;
            display: flex;
            justify-content: space-between;
            text-transform: uppercase;
        }

        .control-label span.val {
            color: #00f3ff;
            font-family: monospace;
        }

        input[type="range"] {
            appearance: none;
            -webkit-appearance: none;
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 2px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00f3ff;
            cursor: pointer;
            box-shadow: 0 0 10px #00f3ff;
        }

        select,
        button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #e0e6ed;
            padding: 9px 12px;
            border-radius: 4px;
            font-size: 11px;
            letter-spacing: 0.5px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
        }

        select:hover,
        button:hover {
            border-color: #00f3ff;
            background: rgba(0, 243, 255, 0.15);
        }

        .btn-record {
            background: rgba(255, 50, 80, 0.18);
            border-color: #ff3355;
            color: #ff3355;
            font-weight: 700;
            margin-top: 6px;
        }

        .btn-record.recording {
            background: #ff3355;
            color: #fff;
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 51, 85, 0.7);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(255, 51, 85, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 51, 85, 0);
            }
        }

        .toggle-ui-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 99;
            background: rgba(4, 8, 15, 0.88);
            border: 1px solid rgba(0, 243, 255, 0.4);
            color: #00f3ff;
            width: 36px;
            height: 36px;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
    </style>

    <!-- Strict Script Load Order -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>

<body>

    <button class="toggle-ui-btn" id="toggle-ui" title="Toggle UI Controls (Hotkey: H)">⚙️</button>

    <div id="hud-panel">
        <div class="panel-header">
            <div class="panel-title">GEOMETRIC MASTERPIECE ENGINE</div>
        </div>

        <div class="panel-content">
            <div class="control-group">
                <div class="control-label">SPECTRUM SHIFT SPEED <span class="val" id="val-color-speed">1.8</span></div>
                <input type="range" id="param-color-speed" min="0.0" max="4.0" step="0.1" value="1.8">
            </div>

            <div class="control-group">
                <div class="control-label">ASCENT VELOCITY <span class="val" id="val-speed">1.8</span></div>
                <input type="range" id="param-speed" min="0.1" max="5.0" step="0.1" value="1.8">
            </div>

            <div class="control-group">
                <div class="control-label">BLOOM INTENSITY <span class="val" id="val-bloom">3.5</span></div>
                <input type="range" id="param-bloom" min="0.5" max="6.0" step="0.1" value="3.5">
            </div>

            <div class="control-group">
                <div class="control-label">FOG DENSITY <span class="val" id="val-fog">0.015</span></div>
                <input type="range" id="param-fog" min="0.005" max="0.06" step="0.001" value="0.015">
            </div>

            <div class="control-group">
                <div class="control-label">CAMERA FLIGHT PATH</div>
                <select id="select-cam-mode">
                    <option value="geometric-vortex">Recursive Core & Swarm</option>
                    <option value="fragment-thread">Swarm Deep Thread</option>
                    <option value="manual">Manual Exploration</option>
                </select>
            </div>

            <div class="control-group">
                <div class="control-label">CANVAS ASPECT RATIO</div>
                <select id="select-aspect">
                    <option value="aspect-9-16">9:16 Vertical Reel</option>
                    <option value="aspect-1-1">1:1 Square</option>
                    <option value="aspect-16-9">16:9 Widescreen</option>
                </select>
            </div>

            <button id="btn-record" class="btn-record">⏺ Record WebM Masterpiece</button>
        </div>
    </div>

    <div id="canvas-container">
        <div id="viewport" class="viewport-frame aspect-9-16"></div>
    </div>

    <script>
        const config = {
            descentSpeed: 1.8,
            colorCycleSpeed: 1.8,
            bloomStrength: 3.5,
            fogDensity: 0.015,
            camMode: 'geometric-vortex'
        };

        const viewport = document.getElementById('viewport');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010103);
        scene.fog = new THREE.FogExp2(0x010103, config.fogDensity);

        const camera = new THREE.PerspectiveCamera(62, viewport.clientWidth / viewport.clientHeight, 0.1, 450);
        camera.position.set(0, 0, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(viewport.clientWidth, viewport.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.4;
        viewport.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- Post-Processing Initialization with Fail-Safe Fallback ---
        let composer = null;
        let bloomPass = null;
        let useComposer = false;

        try {
            const renderPass = new THREE.RenderPass(scene, camera);
            bloomPass = new THREE.UnrealBloomPass(
                new THREE.Vector2(viewport.clientWidth, viewport.clientHeight),
                config.bloomStrength,
                0.7,
                0.65
            );

            const ChromaticAberrationShader = {
                uniforms: {
                    "tDiffuse": { value: null },
                    "amount": { value: 0.006 }
                },
                vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
                fragmentShader: `
          uniform sampler2D tDiffuse;
          uniform float amount;
          varying vec2 vUv;
          void main() {
            vec2 offset = amount * (vUv - 0.5);
            vec4 cr = texture2D(tDiffuse, vUv + offset);
            vec4 cga = texture2D(tDiffuse, vUv);
            vec4 cb = texture2D(tDiffuse, vUv - offset);
            gl_FragColor = vec4(cr.r, cga.g, cb.b, cga.a);
          }
        `
            };

            const chromPass = new THREE.ShaderPass(ChromaticAberrationShader);

            composer = new THREE.EffectComposer(renderer);
            composer.addPass(renderPass);
            composer.addPass(bloomPass);
            composer.addPass(chromPass);
            useComposer = true;
        } catch (err) {
            console.warn("Post-processing setup warning, rendering in direct WebGL mode:", err);
            useComposer = false;
        }

        const worldGroup = new THREE.Group();
        scene.add(worldGroup);

        // --- Geometric Spire Core ---
        const spireMaterials = [];
        const TIER_HEIGHT = 20;
        const TOTAL_TIERS = 12;

        function createGeometricTier(hue, tierIndex) {
            const tierGroup = new THREE.Group();

            const lineMat = new THREE.LineBasicMaterial({
                color: new THREE.Color().setHSL(hue, 1.0, 0.55),
                linewidth: 1.5,
                transparent: true,
                opacity: 0.95
            });

            const fillMat = new THREE.MeshBasicMaterial({
                color: new THREE.Color().setHSL(hue, 1.0, 0.08),
                transparent: true,
                opacity: 0.25,
                side: THREE.DoubleSide
            });

            spireMaterials.push({ lineMat, fillMat, hue, tierIndex });

            const coreGeom = new THREE.OctahedronGeometry(5, 0);
            const coreEdges = new THREE.EdgesGeometry(coreGeom);
            const coreLine = new THREE.LineSegments(coreEdges, lineMat);
            const coreMesh = new THREE.Mesh(coreGeom, fillMat);
            tierGroup.add(coreLine);
            tierGroup.add(coreMesh);

            const innerGeom = new THREE.IcosahedronGeometry(3, 1);
            const innerEdges = new THREE.EdgesGeometry(innerGeom);
            const innerLineMat = new THREE.LineBasicMaterial({
                color: new THREE.Color().setHSL((hue + 0.3) % 1.0, 1.0, 0.5),
                transparent: true,
                opacity: 0.6
            });
            const innerLine = new THREE.LineSegments(innerEdges, innerLineMat);
            tierGroup.add(innerLine);

            const frameGeom = new THREE.TorusGeometry(8, 0.15, 6, 4);
            const frameLine = new THREE.LineSegments(new THREE.EdgesGeometry(frameGeom), lineMat);
            frameLine.rotation.x = Math.PI / 2;
            tierGroup.add(frameLine);

            tierGroup.userData = { isCore: true, tierIndex };
            return tierGroup;
        }

        for (let i = 0; i < TOTAL_TIERS; i++) {
            const hue = (i * 0.12) % 1.0;
            const tier = createGeometricTier(hue, i);
            tier.position.y = -i * TIER_HEIGHT;
            worldGroup.add(tier);
        }

        // --- Dynamic Lighting ---
        const lights = [];
        const lightColors = [0x00f3ff, 0xff33cc, 0xffaa00, 0x00ffcc];

        for (let i = 0; i < lightColors.length; i++) {
            const light = new THREE.PointLight(lightColors[i], 1.5, 60);
            light.userData = { initialIndex: i };
            scene.add(light);
            lights.push(light);
        }
        scene.add(new THREE.AmbientLight(0x0a0a14, 0.9));

        // --- Dynamic Particle Swarm ---
        let streamParticles;
        function initEnergyStreams() {
            const count = 1200;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for (let i = 0; i < count * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 70;
                positions[i + 1] = (Math.random() - 0.5) * (TOTAL_TIERS * TIER_HEIGHT);
                positions[i + 2] = (Math.random() - 0.5) * 70;

                const c = new THREE.Color().setHSL(Math.random(), 1.0, 0.65);
                colors[i] = c.r;
                colors[i + 1] = c.g;
                colors[i + 2] = c.b;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({
                size: 0.4,
                vertexColors: true,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending
            });

            streamParticles = new THREE.Points(geo, mat);
            scene.add(streamParticles);
        }

        // --- UI Controls Event Binding ---
        const hudPanel = document.getElementById('hud-panel');
        document.getElementById('toggle-ui').addEventListener('click', () => hudPanel.classList.toggle('collapsed'));
        window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'h') hudPanel.classList.toggle('collapsed'); });

        document.getElementById('param-color-speed').addEventListener('input', (e) => {
            config.colorCycleSpeed = parseFloat(e.target.value);
            document.getElementById('val-color-speed').innerText = config.colorCycleSpeed;
        });
        document.getElementById('param-speed').addEventListener('input', (e) => {
            config.descentSpeed = parseFloat(e.target.value);
            document.getElementById('val-speed').innerText = config.descentSpeed;
        });
        document.getElementById('param-bloom').addEventListener('input', (e) => {
            config.bloomStrength = parseFloat(e.target.value);
            if (bloomPass) bloomPass.strength = config.bloomStrength;
            document.getElementById('val-bloom').innerText = config.bloomStrength;
        });
        document.getElementById('param-fog').addEventListener('input', (e) => {
            config.fogDensity = parseFloat(e.target.value);
            scene.fog.density = config.fogDensity;
            document.getElementById('val-fog').innerText = config.fogDensity;
        });
        document.getElementById('select-cam-mode').addEventListener('change', (e) => config.camMode = e.target.value);

        document.getElementById('select-aspect').addEventListener('change', (e) => {
            viewport.className = `viewport-frame ${e.target.value}`;
            resize();
        });

        function resize() {
            const w = viewport.clientWidth;
            const h = viewport.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            if (useComposer && composer) composer.setSize(w, h);
        }
        window.addEventListener('resize', resize);

        // --- WebM Recorder Setup ---
        let mediaRecorder = null;
        let chunks = [];
        const recordBtn = document.getElementById('btn-record');

        recordBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            } else {
                chunks = [];
                const stream = renderer.domElement.captureStream(60);
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });

                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `geometric-masterpiece-${Date.now()}.webm`;
                    a.click();
                    recordBtn.classList.remove('recording');
                    recordBtn.innerText = '⏺ Record WebM Masterpiece';
                };

                mediaRecorder.start();
                recordBtn.classList.add('recording');
                recordBtn.innerText = '⏹ Stop & Save Video';
            }
        });

        // --- Main Rendering & Choreography Loop ---
        let clock = new THREE.Clock();
        let currentY = 0;

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const elapsed = clock.getElapsedTime();

            // Spire Rotations
            worldGroup.children.forEach(child => {
                if (child.userData.isCore) {
                    child.rotation.y += delta * 0.65;
                    child.rotation.z += delta * 0.35;
                    const scale = 1 + Math.sin(elapsed * 2 + child.userData.tierIndex * 0.4) * 0.15;
                    child.scale.set(scale, scale, scale);
                }
            });

            // Color Spectrum Shift
            if (config.colorCycleSpeed > 0) {
                spireMaterials.forEach((item) => {
                    const dynamicHue = (item.hue + elapsed * 0.08 * config.colorCycleSpeed) % 1.0;
                    item.lineMat.color.setHSL(dynamicHue, 1.0, 0.55);
                    item.fillMat.color.setHSL(dynamicHue, 1.0, 0.08);
                });
            }

            // Orbiting Point Lights
            lights.forEach(light => {
                const offset = light.userData.initialIndex * (Math.PI / 2);
                const radius = 22 + Math.sin(elapsed * 0.3 + offset) * 5;
                light.position.x = Math.sin(elapsed * 0.8 + offset) * radius;
                light.position.y = currentY + Math.cos(elapsed * 0.4 + offset) * 10 - 20;
                light.position.z = Math.cos(elapsed * 0.8 + offset) * radius;
            });

            // Ascending Energy Stream
            if (streamParticles && config.descentSpeed > 0) {
                const pos = streamParticles.geometry.attributes.position.array;
                for (let i = 1; i < pos.length; i += 3) {
                    pos[i] += config.descentSpeed * delta * 15;
                    if (pos[i] > (TOTAL_TIERS * TIER_HEIGHT) / 2) {
                        pos[i] = -(TOTAL_TIERS * TIER_HEIGHT) / 2;
                    }
                }
                streamParticles.geometry.attributes.position.needsUpdate = true;
            }

            // Camera Movements
            if (config.camMode === 'geometric-vortex') {
                currentY -= config.descentSpeed * delta * 15;
                const totalSpireHeight = TIER_HEIGHT * 2;
                if (currentY < -totalSpireHeight) currentY += totalSpireHeight;

                const radius = 18 + Math.sin(elapsed * 0.6) * 7;
                camera.position.y = currentY;
                camera.position.x = Math.sin(elapsed * 0.8) * radius;
                camera.position.z = Math.cos(elapsed * 0.8) * radius;
                camera.lookAt(0, currentY - 10, 0);

            } else if (config.camMode === 'fragment-thread') {
                currentY -= config.descentSpeed * delta * 18;
                const totalSpireHeight = TIER_HEIGHT * 2;
                if (currentY < -totalSpireHeight) currentY += totalSpireHeight;

                camera.position.y = currentY;
                camera.position.x = Math.sin(elapsed * 1.5) * 4;
                camera.position.z = Math.cos(elapsed * 1.5) * 4;
                camera.rotation.z = Math.sin(elapsed * 1.0) * 0.25;
                camera.lookAt(0, currentY - 15, 0);

            } else {
                controls.update();
            }

            // Render Step
            if (useComposer && composer) {
                composer.render();
            } else {
                renderer.render(scene, camera);
            }
        }

        initEnergyStreams();
        resize();
        animate();
    </script>
</body>

</html>
