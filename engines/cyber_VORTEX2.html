<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Vortex Hyper-Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020208;
            font-family: system-ui, sans-serif;
            color: #e0e6ed;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
        }

        .viewport-frame {
            position: relative;
            background: #000;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .viewport-frame.aspect-9-16 {
            width: calc(100vh * (9/16));
            height: 100vh;
            max-width: 100vw;
        }

        .viewport-frame.aspect-1-1 {
            width: 90vh;
            height: 90vh;
            max-width: 90vw;
            max-height: 90vw;
        }

        .viewport-frame.aspect-16-9 {
            width: 100vw;
            height: calc(100vw * (9/16));
            max-height: 100vh;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        #hud-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 290px;
            background: rgba(4, 8, 18, 0.85);
            border: 1px solid rgba(0, 243, 255, 0.4);
            border-radius: 10px;
            backdrop-filter: blur(25px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 18px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.15);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        #hud-panel.collapsed {
            transform: translateX(-340px);
            opacity: 0;
            pointer-events: none;
        }

        .panel-title {
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #00f3ff;
            text-transform: uppercase;
            text-shadow: 0 0 8px #00f3ff;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .control-label {
            font-size: 10px;
            font-weight: 700;
            color: #8c9eae;
            display: flex;
            justify-content: space-between;
            text-transform: uppercase;
        }

        .control-label span {
            color: #00f3ff;
            font-family: monospace;
        }

        input[type="range"] {
            appearance: none;
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            outline: none;
            border-radius: 2px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #00f3ff;
            cursor: pointer;
            box-shadow: 0 0 12px #00f3ff;
        }

        select,
        button {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(0, 243, 255, 0.3);
            color: #e0e6ed;
            padding: 9px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        select:hover,
        button:hover {
            border-color: #00f3ff;
            background: rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        .btn-record {
            background: rgba(255, 50, 80, 0.2);
            border-color: #ff3355;
            color: #ff3355;
        }

        .btn-record.recording {
            background: #ff3355;
            color: #fff;
            box-shadow: 0 0 20px #ff3355;
        }

        .toggle-ui-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 99;
            background: rgba(4, 8, 18, 0.85);
            border: 1px solid rgba(0, 243, 255, 0.4);
            color: #00f3ff;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>

<body>
    <button class="toggle-ui-btn" id="toggle-ui">⚙️</button>

    <div id="hud-panel">
        <div class="panel-title">⚡ HYPER VORTEX CORE</div>
        <div class="control-group">
            <div class="control-label">WARP SPEED <span id="val-speed">2.0</span></div>
            <input type="range" id="param-speed" min="0.2" max="6.0" step="0.1" value="2.0">
        </div>
        <div class="control-group">
            <div class="control-label">GEOMETRY MORPH <span id="val-morph">AUTO</span></div>
            <input type="range" id="param-morph" min="0" max="2" step="0.01" value="0">
        </div>
        <div class="control-group">
            <div class="control-label">VORTEX TWIST <span id="val-twist">3.5</span></div>
            <input type="range" id="param-twist" min="0.5" max="8.0" step="0.1" value="3.5">
        </div>
        <div class="control-group">
            <div class="control-label">CORE SCALE <span id="val-scale">1.8</span></div>
            <input type="range" id="param-scale" min="0.8" max="3.5" step="0.1" value="1.8">
        </div>
        <div class="control-group">
            <div class="control-label">VIEWPORT ASPECT</div>
            <select id="select-aspect">
                <option value="aspect-9-16">9:16 Vertical Reel</option>
                <option value="aspect-1-1">1:1 Square</option>
                <option value="aspect-16-9">16:9 Widescreen</option>
            </select>
        </div>
        <button id="btn-record" class="btn-record">⏺ Record WebM Clip</button>
    </div>

    <div id="canvas-container">
        <div id="viewport" class="viewport-frame aspect-9-16"></div>
    </div>

    <script>
        const viewport = document.getElementById('viewport');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020209);
        scene.fog = new THREE.FogExp2(0x020209, 0.008);

        const camera = new THREE.PerspectiveCamera(65, viewport.clientWidth / viewport.clientHeight, 0.1, 400);
        camera.position.set(0, 0, 32);

        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(viewport.clientWidth, viewport.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        viewport.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- Helper: Build Morphing Geometry ---
        function createMorphGeometry(radius) {
            // High-density sphere base ensuring equal vertex count across all target shapes
            const baseGeo = new THREE.SphereGeometry(radius, 32, 32);
            const posAttr = baseGeo.attributes.position;
            const vertexCount = posAttr.count;

            const cubeGeo = new THREE.BoxGeometry(radius * 1.5, radius * 1.5, radius * 1.5, 10, 10, 10);
            const octaGeo = new THREE.OctahedronGeometry(radius * 1.6, 4);
            const icoGeo = new THREE.IcosahedronGeometry(radius * 1.6, 3);

            function projectToShape(targetGeo) {
                const targetPositions = new Float32Array(vertexCount * 3);
                const raycaster = new THREE.Raycaster();
                const meshTarget = new THREE.Mesh(targetGeo);
                const dir = new THREE.Vector3();
                const origin = new THREE.Vector3(0, 0, 0);

                for (let i = 0; i < vertexCount; i++) {
                    dir.set(posAttr.getX(i), posAttr.getY(i), posAttr.getZ(i)).normalize();
                    raycaster.set(origin, dir);
                    const intersects = raycaster.intersectObject(meshTarget);
                    if (intersects.length > 0) {
                        const pt = intersects[0].point;
                        targetPositions[i * 3] = pt.x;
                        targetPositions[i * 3 + 1] = pt.y;
                        targetPositions[i * 3 + 2] = pt.z;
                    } else {
                        targetPositions[i * 3] = dir.x * radius;
                        targetPositions[i * 3 + 1] = dir.y * radius;
                        targetPositions[i * 3 + 2] = dir.z * radius;
                    }
                }
                return new THREE.Float32BufferAttribute(targetPositions, 3);
            }

            baseGeo.morphAttributes.position = [
                projectToShape(cubeGeo), // Morph target 0: Cube
                projectToShape(octaGeo), // Morph target 1: Octahedron
                projectToShape(icoGeo)   // Morph target 2: Icosahedron
            ];

            return baseGeo;
        }

        // --- Construct Core Wireframe Meshes ---
        const coreGeo = createMorphGeometry(4.5);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: true, transparent: true, opacity: 0.85 });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        scene.add(coreMesh);

        const innerGeo = createMorphGeometry(2.5);
        const innerMat = new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true, transparent: true, opacity: 0.95 });
        const innerMesh = new THREE.Mesh(innerGeo, innerMat);
        scene.add(innerMesh);

        // --- Outer Vortex Tunnel ---
        const tunnelGroup = new THREE.Group();
        scene.add(tunnelGroup);
        const RING_COUNT = 70;
        const ringMaterials = [];

        for (let i = 0; i < RING_COUNT; i++) {
            const radius = 10 + Math.pow(i * 0.22, 1.4);
            const geo = new THREE.TorusGeometry(radius, 0.2, 12, 8);
            const hue = (i * 0.015) % 1.0;
            const mat = new THREE.MeshBasicMaterial({
                color: new THREE.Color().setHSL(hue, 1.0, 0.55),
                wireframe: true,
                transparent: true,
                opacity: Math.max(0.2, 1 - (i / RING_COUNT))
            });
            ringMaterials.push({ mat, baseHue: hue });

            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.z = -i * 3.5 + 40;
            tunnelGroup.add(mesh);
        }

        // --- Particle Field ---
        const particleCount = 1200;
        const particleGeo = new THREE.BufferGeometry();
        const particlePos = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            particlePos[i] = (Math.random() - 0.5) * 120;
            particlePos[i + 1] = (Math.random() - 0.5) * 120;
            particlePos[i + 2] = (Math.random() - 0.5) * 200;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
        const particleMat = new THREE.PointsMaterial({ size: 0.4, color: 0x00f3ff, transparent: true, opacity: 0.7 });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        // --- Parameters & Event Listeners ---
        let speed = 2.0;
        let twist = 3.5;
        let scale = 1.8;
        let manualMorph = false;
        let morphValue = 0;

        document.getElementById('param-speed').addEventListener('input', e => {
            speed = parseFloat(e.target.value);
            document.getElementById('val-speed').innerText = speed.toFixed(1);
        });
        document.getElementById('param-twist').addEventListener('input', e => {
            twist = parseFloat(e.target.value);
            document.getElementById('val-twist').innerText = twist.toFixed(1);
        });
        document.getElementById('param-scale').addEventListener('input', e => {
            scale = parseFloat(e.target.value);
            document.getElementById('val-scale').innerText = scale.toFixed(1);
        });
        document.getElementById('param-morph').addEventListener('input', e => {
            morphValue = parseFloat(e.target.value);
            manualMorph = true;
            document.getElementById('val-morph').innerText = morphValue.toFixed(2);
        });
        document.getElementById('toggle-ui').addEventListener('click', () => {
            document.getElementById('hud-panel').classList.toggle('collapsed');
        });
        document.getElementById('select-aspect').addEventListener('change', e => {
            viewport.className = `viewport-frame ${e.target.value}`;
            resize();
        });

        function resize() {
            const w = viewport.clientWidth;
            const h = viewport.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }
        window.addEventListener('resize', resize);

        // --- WebM Recorder ---
        let mediaRecorder, chunks = [];
        const recordBtn = document.getElementById('btn-record');
        recordBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            } else {
                chunks = [];
                const stream = renderer.domElement.captureStream(60);
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `morph-vortex-${Date.now()}.webm`;
                    a.click();
                    recordBtn.classList.remove('recording');
                    recordBtn.innerText = '⏺ Record WebM Clip';
                };
                mediaRecorder.start();
                recordBtn.classList.add('recording');
                recordBtn.innerText = '⏹ Stop & Save Video';
            }
        });

        // --- Morph Calculation Logic ---
        function applyMorphState(mesh, val) {
            // Target 0 = Cube, Target 1 = Octahedron, Target 2 = Icosahedron
            mesh.morphTargetInfluences[0] = Math.max(0, 1 - Math.abs(val - 0));
            mesh.morphTargetInfluences[1] = Math.max(0, 1 - Math.abs(val - 1));
            mesh.morphTargetInfluences[2] = Math.max(0, 1 - Math.abs(val - 2));
        }

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();

            // Compute morph state (cyclic 0 -> 1 -> 2 -> 0 if auto)
            let currentMorph = morphValue;
            if (!manualMorph) {
                currentMorph = (Math.sin(elapsed * 0.8) + 1); // Oscillates between 0 and 2 smoothly
            }
            applyMorphState(coreMesh, currentMorph);
            applyMorphState(innerMesh, (currentMorph + 1) % 2); // Offset inner core geometry

            // Animate core rotations
            coreMesh.rotation.x = elapsed * speed * 0.3;
            coreMesh.rotation.y = elapsed * speed * 0.5;
            coreMesh.scale.setScalar(scale + Math.sin(elapsed * 3) * 0.15);

            innerMesh.rotation.x = -elapsed * speed * 0.6;
            innerMesh.rotation.z = elapsed * speed * 0.4;

            // Animate vortex rings
            tunnelGroup.children.forEach((ring, idx) => {
                ring.rotation.z = elapsed * speed * 0.4 + idx * (twist * 0.04);
                ring.rotation.x = Math.sin(elapsed * 0.8 + idx * 0.08) * 0.25;

                const currentHue = (ringMaterials[idx].baseHue + elapsed * 0.12) % 1.0;
                ringMaterials[idx].mat.color.setHSL(currentHue, 1.0, 0.55);
            });

            // Animate particle drift
            const positions = particleGeo.attributes.position.array;
            for (let i = 2; i < particleCount * 3; i += 3) {
                positions[i] += speed * 0.2;
                if (positions[i] > 100) positions[i] = -100;
            }
            particleGeo.attributes.position.needsUpdate = true;

            controls.update();
            renderer.render(scene, camera);
        }
        resize();
        animate();
    </script>
</body>

</html>
