<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Vortex Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: system-ui, sans-serif;
            color: #e0e6ed;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
        }

        .viewport-frame {
            position: relative;
            background: #000;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .viewport-frame.aspect-9-16 {
            width: calc(100vh * (9/16));
            height: 100vh;
            max-width: 100vw;
        }

        .viewport-frame.aspect-1-1 {
            width: 90vh;
            height: 90vh;
            max-width: 90vw;
            max-height: 90vw;
        }

        .viewport-frame.aspect-16-9 {
            width: 100vw;
            height: calc(100vw * (9/16));
            max-height: 100vh;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        #hud-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 280px;
            background: rgba(4, 8, 15, 0.92);
            border: 1px solid rgba(0, 243, 255, 0.35);
            border-radius: 8px;
            backdrop-filter: blur(20px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 16px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        #hud-panel.collapsed {
            transform: translateX(-320px);
            opacity: 0;
            pointer-events: none;
        }

        .panel-title {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #00f3ff;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .control-label {
            font-size: 10px;
            font-weight: 700;
            color: #8c9eae;
            display: flex;
            justify-content: space-between;
            text-transform: uppercase;
        }

        .control-label span {
            color: #00f3ff;
            font-family: monospace;
        }

        input[type="range"] {
            appearance: none;
            -webkit-appearance: none;
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.12);
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00f3ff;
            cursor: pointer;
            box-shadow: 0 0 10px #00f3ff;
        }

        select,
        button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #e0e6ed;
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }

        select:hover,
        button:hover {
            border-color: #00f3ff;
            background: rgba(0, 243, 255, 0.15);
        }

        .btn-record {
            background: rgba(255, 50, 80, 0.18);
            border-color: #ff3355;
            color: #ff3355;
            font-weight: 700;
        }

        .btn-record.recording {
            background: #ff3355;
            color: #fff;
        }

        .toggle-ui-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 99;
            background: rgba(4, 8, 15, 0.88);
            border: 1px solid rgba(0, 243, 255, 0.4);
            color: #00f3ff;
            width: 36px;
            height: 36px;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>

<body>
    <button class="toggle-ui-btn" id="toggle-ui">⚙️</button>

    <div id="hud-panel">
        <div class="panel-title">CYBER VORTEX ENGINE</div>
        <div class="control-group">
            <div class="control-label">ROTATION SPEED <span id="val-speed">1.5</span></div>
            <input type="range" id="param-speed" min="0.1" max="4.0" step="0.1" value="1.5">
        </div>
        <div class="control-group">
            <div class="control-label">VORTEX TWIST <span id="val-twist">2.0</span></div>
            <input type="range" id="param-twist" min="0.5" max="5.0" step="0.1" value="2.0">
        </div>
        <div class="control-group">
            <div class="control-label">CANVAS ASPECT</div>
            <select id="select-aspect">
                <option value="aspect-9-16">9:16 Vertical Reel</option>
                <option value="aspect-1-1">1:1 Square</option>
                <option value="aspect-16-9">16:9 Widescreen</option>
            </select>
        </div>
        <button id="btn-record" class="btn-record">⏺ Record WebM Reel</button>
    </div>

    <div id="canvas-container">
        <div id="viewport" class="viewport-frame aspect-9-16"></div>
    </div>

    <script>
        const viewport = document.getElementById('viewport');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020208);
        scene.fog = new THREE.FogExp2(0x020208, 0.012);

        const camera = new THREE.PerspectiveCamera(60, viewport.clientWidth / viewport.clientHeight, 0.1, 300);
        camera.position.set(0, 0, 45);

        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(viewport.clientWidth, viewport.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        viewport.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ringGroup = new THREE.Group();
        scene.add(ringGroup);

        const RING_COUNT = 40;
        const ringMaterials = [];

        for (let i = 0; i < RING_COUNT; i++) {
            const geo = new THREE.TorusGeometry(8 + i * 0.4, 0.12, 8, 6);
            const hue = (i * 0.025) % 1.0;
            const mat = new THREE.MeshBasicMaterial({
                color: new THREE.Color().setHSL(hue, 1.0, 0.5),
                wireframe: true,
                transparent: true,
                opacity: 0.8
            });
            ringMaterials.push({ mat, baseHue: hue });

            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.z = -i * 3;
            ringGroup.add(mesh);
        }

        let speed = 1.5;
        let twist = 2.0;

        document.getElementById('param-speed').addEventListener('input', e => {
            speed = parseFloat(e.target.value);
            document.getElementById('val-speed').innerText = speed;
        });
        document.getElementById('param-twist').addEventListener('input', e => {
            twist = parseFloat(e.target.value);
            document.getElementById('val-twist').innerText = twist;
        });
        document.getElementById('toggle-ui').addEventListener('click', () => {
            document.getElementById('hud-panel').classList.toggle('collapsed');
        });
        document.getElementById('select-aspect').addEventListener('change', e => {
            viewport.className = `viewport-frame ${e.target.value}`;
            resize();
        });

        function resize() {
            const w = viewport.clientWidth;
            const h = viewport.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }
        window.addEventListener('resize', resize);

        let mediaRecorder, chunks = [];
        const recordBtn = document.getElementById('btn-record');
        recordBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            } else {
                chunks = [];
                const stream = renderer.domElement.captureStream(60);
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `cyber-vortex-${Date.now()}.webm`;
                    a.click();
                    recordBtn.classList.remove('recording');
                    recordBtn.innerText = '⏺ Record WebM Reel';
                };
                mediaRecorder.start();
                recordBtn.classList.add('recording');
                recordBtn.innerText = '⏹ Stop & Save Video';
            }
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();

            ringGroup.children.forEach((ring, idx) => {
                ring.rotation.z = elapsed * speed * 0.5 + idx * (twist * 0.05);
                ring.rotation.x = Math.sin(elapsed * 0.5 + idx * 0.1) * 0.2;

                const currentHue = (ringMaterials[idx].baseHue + elapsed * 0.1) % 1.0;
                ringMaterials[idx].mat.color.setHSL(currentHue, 1.0, 0.55);
            });

            controls.update();
            renderer.render(scene, camera);
        }
        resize();
        animate();
    </script>
</body>

</html>
