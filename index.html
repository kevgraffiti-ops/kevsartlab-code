<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kev's Art Lab - 3D Visual Hub</title>
    <style>
        body {
            background: #080810;
            color: #00f3ff;
            font-family: system-ui, sans-serif;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 24px;
            text-shadow: 0 0 10px #00f3ff;
        }

        .engine-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            width: 100%;
            max-width: 900px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.3);
            padding: 20px;
            border-radius: 8px;
            text-decoration: none;
            color: #fff;
            text-align: center;
            font-weight: bold;
            transition: all 0.2s;
        }

        .card:hover {
            border-color: #00f3ff;
            background: rgba(0, 243, 255, 0.15);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <h1>⚡ KEV'S 3D ART LAB</h1>
