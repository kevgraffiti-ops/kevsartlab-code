<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escher Matrix: Intertwined Stairs & Corridors</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #e0e6ed;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
        }

        .viewport-frame {
            position: relative;
            background: #000;
            box-shadow: 0 0 100px rgba(0, 0, 0, 0.98);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .viewport-frame.aspect-9-16 {
            width: calc(100vh * (9/16));
            height: 100vh;
            max-width: 100vw;
        }

        .viewport-frame.aspect-1-1 {
            width: 90vh;
            height: 90vh;
            max-width: 90vw;
            max-height: 90vw;
        }

        .viewport-frame.aspect-16-9 {
            width: 100vw;
            height: calc(100vw * (9/16));
            max-height: 100vh;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        #hud-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 320px;
            background: rgba(4, 8, 15, 0.9);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 8px;
            backdrop-filter: blur(18px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.9);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }

        #hud-panel.collapsed {
            transform: translateX(-350px);
            opacity: 0;
            pointer-events: none;
        }

        .panel-header {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
        }

        .panel-title {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #00f3ff;
        }

        .panel-content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #7a8b9e;
            display: flex;
            justify-content: space-between;
            text-transform: uppercase;
        }

        .control-label span.val {
            color: #00f3ff;
            font-family: monospace;
        }

        input[type="range"] {
            appearance: none;
            -webkit-appearance: none;
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00f3ff;
            cursor: pointer;
            box-shadow: 0 0 10px #00f3ff;
        }

        select,
        button {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #e0e6ed;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 11px;
            letter-spacing: 0.5px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
        }

        select:hover,
        button:hover {
            border-color: #00f3ff;
            background: rgba(0, 243, 255, 0.1);
        }

        .btn-record {
            background: rgba(255, 50, 80, 0.15);
            border-color: #ff3355;
            color: #ff3355;
            font-weight: 700;
            margin-top: 6px;
        }

        .btn-record.recording {
            background: #ff3355;
            color: #fff;
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 51, 85, 0.7);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(255, 51, 85, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 51, 85, 0);
            }
        }

        .toggle-ui-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 99;
            background: rgba(4, 8, 15, 0.85);
            border: 1px solid rgba(0, 243, 255, 0.35);
            color: #00f3ff;
            width: 36px;
            height: 36px;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>

<body>

    <button class="toggle-ui-btn" id="toggle-ui" title="Toggle UI Controls (Hotkey: H)">⚙️</button>

    <div id="hud-panel">
        <div class="panel-header">
            <div class="panel-title">ESCHER MATRIX ENGINE</div>
        </div>

        <div class="panel-content">
            <div class="control-group">
                <div class="control-label">SPECTRUM WAVE SPEED <span class="val" id="val-color-speed">1.2</span></div>
                <input type="range" id="param-color-speed" min="0.0" max="3.0" step="0.1" value="1.2">
            </div>

            <div class="control-group">
                <div class="control-label">DESCENT VELOCITY <span class="val" id="val-speed">1.5</span></div>
                <input type="range" id="param-speed" min="0.1" max="4.0" step="0.1" value="1.5">
            </div>

            <div class="control-group">
                <div class="control-label">BLOOM INTENSITY <span class="val" id="val-bloom">3.2</span></div>
                <input type="range" id="param-bloom" min="0.5" max="5.0" step="0.1" value="3.2">
            </div>

            <div class="control-group">
                <div class="control-label">FOG DENSITY <span class="val" id="val-fog">0.018</span></div>
                <input type="range" id="param-fog" min="0.005" max="0.05" step="0.001" value="0.018">
            </div>

            <div class="control-group">
                <div class="control-label">CAMERA FLIGHT PATH</div>
                <select id="select-cam-mode">
                    <option value="escher-corkscrew">Intertwined Corkscrew Descent</option>
                    <option value="corridor-fly">Corridor Deep Thread</option>
                    <option value="manual">Manual Exploration</option>
                </select>
            </div>

            <div class="control-group">
                <div class="control-label">CANVAS ASPECT RATIO</div>
                <select id="select-aspect">
                    <option value="aspect-9-16">9:16 Vertical Reel</option>
                    <option value="aspect-1-1">1:1 Square</option>
                    <option value="aspect-16-9">16:9 Widescreen</option>
                </select>
            </div>

            <button id="btn-record" class="btn-record">⏺ Record WebM Masterpiece</button>
        </div>
    </div>

    <div id="canvas-container">
        <div id="viewport" class="viewport-frame aspect-9-16"></div>
    </div>

    <script>
        const config = {
            descentSpeed: 1.5,
            colorCycleSpeed: 1.2,
            bloomStrength: 3.2,
            fogDensity: 0.018,
            camMode: 'escher-corkscrew'
        };

        const viewport = document.getElementById('viewport');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010204);
        scene.fog = new THREE.FogExp2(0x010204, config.fogDensity);

        const camera = new THREE.PerspectiveCamera(65, viewport.clientWidth / viewport.clientHeight, 0.1, 400);
        camera.position.set(0, 0, 18);

        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(viewport.clientWidth, viewport.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.4;
        viewport.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        const renderPass = new THREE.RenderPass(scene, camera);
        const bloomPass = new THREE.UnrealBloomPass(
            new THREE.Vector2(viewport.clientWidth, viewport.clientHeight),
            config.bloomStrength,
            0.7,
            0.7
        );

        const ChromaticAberrationShader = {
            uniforms: {
                "tDiffuse": { value: null },
                "amount": { value: 0.006 }
            },
            vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
            fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float amount;
        varying vec2 vUv;
        void main() {
          vec2 offset = amount * (vUv - 0.5);
          vec4 cr = texture2D(tDiffuse, vUv + offset);
          vec4 cga = texture2D(tDiffuse, vUv);
          vec4 cb = texture2D(tDiffuse, vUv - offset);
          gl_FragColor = vec4(cr.r, cga.g, cb.b, cga.a);
        }
      `
        };

        const chromPass = new THREE.ShaderPass(ChromaticAberrationShader);

        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderPass);
        composer.addPass(bloomPass);
        composer.addPass(chromPass);

        const worldGroup = new THREE.Group();
        scene.add(worldGroup);

        const GRID_SIZE = 4;
        const SPACING_X = 22;
        const SPACING_Y = 20;
        const SPACING_Z = 22;
        const registeredMaterials = [];

        function createDynamicMaterial(baseHue, opacityLine = 0.95, opacityMesh = 0.15) {
            const lineMat = new THREE.LineBasicMaterial({
                color: new THREE.Color().setHSL(baseHue, 1.0, 0.5),
                linewidth: 1.5,
                transparent: true,
                opacity: opacityLine
            });

            const fillMat = new THREE.MeshBasicMaterial({
                color: new THREE.Color().setHSL(baseHue, 1.0, 0.06),
                transparent: true,
                opacity: opacityMesh,
                side: THREE.DoubleSide
            });

            registeredMaterials.push({ lineMat, fillMat, baseHue });
            return { lineMat, fillMat };
        }

        function createStaircase(hue, steps = 12, width = 6, height = 9, depth = 9) {
            const group = new THREE.Group();
            const stepH = height / steps;
            const stepD = depth / steps;
            const { lineMat, fillMat } = createDynamicMaterial(hue);

            for (let i = 0; i < steps; i++) {
                const geo = new THREE.BoxGeometry(width, stepH, stepD);
                const edges = new THREE.EdgesGeometry(geo);
                const line = new THREE.LineSegments(edges, lineMat);
                const mesh = new THREE.Mesh(geo, fillMat);

                const step = new THREE.Group();
                step.add(line);
                step.add(mesh);
                step.position.set(0, i * stepH - height / 2, i * stepD - depth / 2);
                group.add(step);
            }
            return group;
        }

        function createCorridorTunnel(hue, length = 20, width = 7, height = 7) {
            const group = new THREE.Group();
            const { lineMat, fillMat } = createDynamicMaterial(hue, 0.8, 0.1);
            const segments = 8;
            const segLen = length / segments;

            for (let i = 0; i < segments; i++) {
                const geo = new THREE.BoxGeometry(width, height, segLen);
                const edges = new THREE.EdgesGeometry(geo);
                const line = new THREE.LineSegments(edges, lineMat);
                const mesh = new THREE.Mesh(geo, fillMat);

                const section = new THREE.Group();
                section.add(line);
                section.add(mesh);
                section.position.z = i * segLen - length / 2;
                group.add(section);
            }
            return group;
        }

        function createNexusCore(hue) {
            const group = new THREE.Group();
            const { lineMat, fillMat } = createDynamicMaterial(hue, 1.0, 0.35);

            const outerGeo = new THREE.OctahedronGeometry(4, 0);
            const outerEdges = new THREE.EdgesGeometry(outerGeo);
            const outerLine = new THREE.LineSegments(outerEdges, lineMat);
            const outerMesh = new THREE.Mesh(outerGeo, fillMat);

            const innerGeo = new THREE.IcosahedronGeometry(2, 0);
            const innerEdges = new THREE.EdgesGeometry(innerGeo);
            const innerLine = new THREE.LineSegments(innerEdges, lineMat);

            group.add(outerLine);
            group.add(outerMesh);
            group.add(innerLine);
            group.userData = { isNexus: true };
            return group;
        }

        function buildEscherMatrix() {
            for (let x = 0; x < GRID_SIZE; x++) {
                for (let y = 0; y < GRID_SIZE; y++) {
                    for (let z = 0; z < GRID_SIZE; z++) {
                        const posX = (x - (GRID_SIZE - 1) / 2) * SPACING_X;
                        const posY = (y - (GRID_SIZE - 1) / 2) * SPACING_Y;
                        const posZ = (z - (GRID_SIZE - 1) / 2) * SPACING_Z;

                        const cellGroup = new THREE.Group();
                        cellGroup.position.set(posX, posY, posZ);

                        const baseHue = (x * 0.25 + y * 0.15 + z * 0.2) % 1.0;

                        if ((x + y + z) % 2 === 0) {
                            const corridorX = createCorridorTunnel((baseHue + 0.1) % 1.0, SPACING_X);
                            corridorX.rotation.y = Math.PI / 2;
                            cellGroup.add(corridorX);

                            const corridorZ = createCorridorTunnel((baseHue + 0.3) % 1.0, SPACING_Z);
                            cellGroup.add(corridorZ);
                        }

                        const stair1 = createStaircase(baseHue);
                        stair1.position.set(-3, 0, 0);
                        stair1.rotation.y = (x * Math.PI) / 2;
                        stair1.rotation.z = (y % 2 === 0) ? 0 : Math.PI;
                        cellGroup.add(stair1);

                        const stair2 = createStaircase((baseHue + 0.4) % 1.0);
                        stair2.position.set(3, 0, 0);
                        stair2.rotation.x = Math.PI / 2;
                        stair2.rotation.y = (z * Math.PI) / 4;
                        cellGroup.add(stair2);

                        if (x % 2 === 0 && z % 2 === 0) {
                            const core = createNexusCore((baseHue + 0.6) % 1.0);
                            cellGroup.add(core);
                        }

                        worldGroup.add(cellGroup);
                    }
                }
            }
        }

        let streamParticles;
        function initEnergyStreams() {
            const count = 750;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for (let i = 0; i < count * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * (GRID_SIZE * SPACING_X);
                positions[i + 1] = (Math.random() - 0.5) * (GRID_SIZE * SPACING_Y);
                positions[i + 2] = (Math.random() - 0.5) * (GRID_SIZE * SPACING_Z);

                const c = new THREE.Color().setHSL(Math.random(), 1.0, 0.65);
                colors[i] = c.r;
                colors[i + 1] = c.g;
                colors[i + 2] = c.b;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({
                size: 0.35,
                vertexColors: true,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending
            });

            streamParticles = new THREE.Points(geo, mat);
            scene.add(streamParticles);
        }

        const hudPanel = document.getElementById('hud-panel');
        document.getElementById('toggle-ui').addEventListener('click', () => hudPanel.classList.toggle('collapsed'));
        window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'h') hudPanel.classList.toggle('collapsed'); });

        document.getElementById('param-color-speed').addEventListener('input', (e) => {
            config.colorCycleSpeed = parseFloat(e.target.value);
            document.getElementById('val-color-speed').innerText = config.colorCycleSpeed;
        });
        document.getElementById('param-speed').addEventListener('input', (e) => {
            config.descentSpeed = parseFloat(e.target.value);
            document.getElementById('val-speed').innerText = config.descentSpeed;
        });
        document.getElementById('param-bloom').addEventListener('input', (e) => {
            config.bloomStrength = parseFloat(e.target.value);
            bloomPass.strength = config.bloomStrength;
            document.getElementById('val-bloom').innerText = config.bloomStrength;
        });
        document.getElementById('param-fog').addEventListener('input', (e) => {
            config.fogDensity = parseFloat(e.target.value);
            scene.fog.density = config.fogDensity;
            document.getElementById('val-fog').innerText = config.fogDensity;
        });
        document.getElementById('select-cam-mode').addEventListener('change', (e) => config.camMode = e.target.value);

        document.getElementById('select-aspect').addEventListener('change', (e) => {
            viewport.className = `viewport-frame ${e.target.value}`;
            resize();
        });

        function resize() {
            const w = viewport.clientWidth;
            const h = viewport.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            composer.setSize(w, h);
        }
        window.addEventListener('resize', resize);

        let mediaRecorder = null;
        let chunks = [];
        const recordBtn = document.getElementById('btn-record');

        recordBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            } else {
                chunks = [];
                const stream = renderer.domElement.captureStream(60);
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });

                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `escher-matrix-masterpiece-${Date.now()}.webm`;
                    a.click();
                    recordBtn.classList.remove('recording');
                    recordBtn.innerText = '⏺ Record WebM Masterpiece';
                };

                mediaRecorder.start();
                recordBtn.classList.add('recording');
                recordBtn.innerText = '⏹ Stop & Save Video';
            }
        });

        let clock = new THREE.Clock();
        let currentY = 0;

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const elapsed = clock.getElapsedTime();

            if (config.colorCycleSpeed > 0) {
                registeredMaterials.forEach((item) => {
                    const dynamicHue = (item.baseHue + elapsed * 0.08 * config.colorCycleSpeed) % 1.0;
                    item.lineMat.color.setHSL(dynamicHue, 1.0, 0.55);
                    item.fillMat.color.setHSL(dynamicHue, 1.0, 0.06);
                });
            }

            worldGroup.traverse(child => {
                if (child.userData.isNexus) {
                    child.rotation.x += delta * 0.6;
                    child.rotation.y += delta * 1.0;
                    const scale = 1 + Math.sin(elapsed * 5) * 0.15;
                    child.scale.set(scale, scale, scale);
                }
            });

            if (streamParticles) {
                const pos = streamParticles.geometry.attributes.position.array;
                for (let i = 1; i < pos.length; i += 3) {
                    pos[i] += config.descentSpeed * 0.3;
                    if (pos[i] > (GRID_SIZE * SPACING_Y) / 2) {
                        pos[i] = -(GRID_SIZE * SPACING_Y) / 2;
                    }
                }
                streamParticles.geometry.attributes.position.needsUpdate = true;
            }

            if (config.camMode === 'escher-corkscrew') {
                currentY -= config.descentSpeed * delta * 12;
                const totalHeight = SPACING_Y * 2;
                if (currentY < -totalHeight) currentY += totalHeight;

                const radius = 16 + Math.sin(elapsed * 0.5) * 6;
                camera.position.y = currentY;
                camera.position.x = Math.sin(elapsed * 0.8) * radius;
                camera.position.z = Math.cos(elapsed * 0.8) * radius;
                camera.rotation.z = Math.sin(elapsed * 0.6) * 0.25;
                camera.lookAt(0, currentY - 8, 0);

            } else if (config.camMode === 'corridor-fly') {
                currentY -= config.descentSpeed * delta * 16;
                const totalHeight = SPACING_Y * 2;
                if (currentY < -totalHeight) currentY += totalHeight;

                camera.position.y = currentY;
                camera.position.x = Math.sin(elapsed * 1.5) * 3;
                camera.position.z = Math.cos(elapsed * 1.5) * 3;
                camera.lookAt(0, currentY - 12, 0);

            } else {
                controls.update();
            }

            composer.render();
        }

        buildEscherMatrix();
        initEnergyStreams();
        resize();
        animate();
    </script>
</body>

</html>
